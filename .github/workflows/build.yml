name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      EXPORT_NAME: KingdomOfHeroes-3D
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Download Godot and Export Templates
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        mv ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true
        ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
        
    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        export ANDROID_HOME=/usr/lib/android-sdk
        export ANDROID_SDK_ROOT=/usr/lib/android-sdk
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
        
    - name: Create Debug Keystore
      run: |
        keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Headless Export Test (PCK)
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        ANDROID_SDK_ROOT: /usr/lib/android-sdk
      run: |
        ./godot --headless --path . --export-pack "Android" /tmp/test.pck 2>&1 | tail -40 || echo "PCK export attempted"
        
    - name: Export Android APK
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        ANDROID_SDK_ROOT: /usr/lib/android-sdk
      run: |
        mkdir -p builds
        ./godot --headless --path . --export-debug "Android" builds/${EXPORT_NAME}.apk 2>&1 | tail -60
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KingdomOfHeroes-3D-APK
        path: builds/${{ env.EXPORT_NAME }}.apk
        retention-days: 30
        if-no-files-found: error
