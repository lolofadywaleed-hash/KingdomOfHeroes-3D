name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Download Godot
      run: |
        wget -O godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip godot.zip
        chmod +x Godot_v4.7.2-stable_linux.x86_64
        mv Godot_v4.7.2-stable_linux.x86_64 godot
        wget -O templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
        unzip templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
        mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
        rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Create keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Build APK
      run: |
        mkdir -p builds
        ./godot --headless --export-debug "Android" builds/KingdomOfHeroes-3D.apk 2>&1 | tail -30
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KingdomOfHeroes-3D-APK
        path: builds/KingdomOfHeroes-3D.apk
        retention-days: 30
