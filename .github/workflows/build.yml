name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      EXPORT_NAME: KingdomOfHeroes-3D
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Download Godot and Export Templates
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/tp
        find /tmp/tp -name "*.apk" -o -name "*.zip" | xargs -I{} cp {} ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
        ls -lh ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
        
    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        cp -r cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
        
    - name: Create Debug Keystore
      run: |
        keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Export Android APK
      run: |
        mkdir -p builds
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        ./godot --headless --path . --export-debug "Android" builds/${EXPORT_NAME}.apk 2>&1 | tail -25
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KingdomOfHeroes-3D-APK
        path: builds/${{ env.EXPORT_NAME }}.apk
        retention-days: 30
        if-no-files-found: error
