name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build PCK first
        run: |
          mkdir -v -p build/pck
          godot --headless --path $GITHUB_WORKSPACE --export-pack "Android" build/pck/KingdomOfHeroes-3D.pck 2>&1 | tail -20
      - name: Build APK
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd $GITHUB_WORKSPACE
          godot --headless --verbose --path $GITHUB_WORKSPACE --export-debug "Android" "$EXPORT_DIR/android/KingdomOfHeroes-3D.apk" 2>&1 | tail -40
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KingdomOfHeroes-3D-APK
          path: build/android
          if-no-files-found: error
