name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Install Android build template
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf android/
          unzip -o ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/
          # Try to commit using gh CLI
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}" 2>/dev/null || true
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add android/
          git commit -m "ci: add android build template" || echo "No changes"
          git push origin main || echo "Push failed"
      - name: Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd $GITHUB_WORKSPACE
          godot --headless --verbose --path $GITHUB_WORKSPACE --export-debug "Android" "$EXPORT_DIR/android/KingdomOfHeroes-3D.apk" 2>&1 | tail -40
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KingdomOfHeroes-3D-APK
          path: build/android
          if-no-files-found: error
