name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* /github/home/.local/share/godot/export_templates/ 2>&1 | tail -2
      - name: Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build
        run: |
          mkdir -p builds
          godot --headless --path $GITHUB_WORKSPACE --export-debug "Android" $GITHUB_WORKSPACE/builds/KingdomOfHeroes-3D.apk 2>&1 | tail -80
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KingdomOfHeroes-3D-APK
          path: builds/KingdomOfHeroes-3D.apk
          if-no-files-found: error
